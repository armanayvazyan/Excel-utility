name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2024.1
        env:
          QODANA_TOKEN: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJwcm9qZWN0IjoiTG5EOVYiLCJvcmdhbml6YXRpb24iOiJnTlk3byIsInRva2VuIjoiVmtCNGcifQ.cw2Pr90QkpocKdmM-7JW7fkDLw0csepk1ImgPQwtiNE'
          QODANA_ENDPOINT: 'https://web.cloud.sssa-stgn.aws.intellij.net'